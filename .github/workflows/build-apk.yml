name: metehan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sistem paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake \
            libffi-dev libssl-dev

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK ve AIDL kur
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

          echo "AIDL kontrol:"
          find "$ANDROID_HOME" -name aidl -type f -print

          AIDL_PATH=$(find "$ANDROID_HOME/build-tools" -name aidl -type f | sort | tail -1)

          if [ -z "$AIDL_PATH" ]; then
            echo "AIDL bulunamadı!"
            exit 1
          fi

          echo "AIDL bulundu: $AIDL_PATH"
          "$AIDL_PATH" --version

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Buildozer ayarla
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Hali Yikama Otomasyonu
          package.name = haliotomasyon
          package.domain = org.haliyikama
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0

          [buildozer]
          log_level = 2
          warn_on_root = 1

          [app:android]
          android.api = 35
          android.minapi = 21
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.permissions = INTERNET
          EOF

      - name: APK oluştur
        run: |
          buildozer android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: hali-yikama-apk
          path: bin/*.apk
