name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Buildozer ayarını oluştur
        run: |
          cat > buildozer.spec <<'EOF'

          [app]

          title = Hali Yikama Otomasyonu

          package.name = haliotomasyon

          package.domain = org.haliyikama

          source.dir = .

          source.include_exts = py,png,jpg,kv,atlas

          version = 1.0

          requirements = python3,kivy

          orientation = portrait

          fullscreen = 0

          android.api = 35

          android.minapi = 21

          android.ndk_api = 21

          android.archs = arm64-v8a

          android.accept_sdk_license = True

          android.skip_update = False

          android.permissions = INTERNET


          [buildozer]

          log_level = 2

          warn_on_root = 1

          EOF

      - name: SDK lisanslarını kabul et
        run: |
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

      - name: APK oluştur
        run: |
          yes | buildozer android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: hali-yikama-apk
          path: bin/*.apk
